# REFERENCE CONFIGURATION ONLY — archived notebooks DO NOT read config.yaml.
# Change variables inside each notebook to alter its dataset/checkpoint paths.
project: REMNET
experiment_design:
  original_classification_and_sustainability_are_separate_runs: true
  external_evaluations_use_frozen_classification_checkpoints: true
  seeds: [7, 49, 112, 345, 476]
  class_names: [cardboard, glass, metal, paper, plastic, trash]
  class_count: 6
  precision: fp32  # check notebook before assuming autocast/AMP settings
  output_parent_kaggle: /kaggle/working

software_observed:
  python: '3.13.18'
  pytorch: '2.11.0+cu130'
  torchvision: '0.26.0+cu130'
  timm: '1.0.30'
  codecarbon: '3.3.2'
  kagglehub: '1.0.3'
  numpy: '2.1.3'
  pandas: '2.3.3'
  pillow: '13.0.0'
  other_imports_not_exactly_pinned_in_archive:
    - scipy
    - scikit-learn
    - matplotlib
    - python-docx
    - scikit-image
    - opencv-python  # import cv2; requirements use headless variant
    - transformers
    - ipython

datasets:
  d1_original:
    url: https://www.kaggle.com/datasets/saumyamohandas/garbage-classification-image-dataset
    kaggle_handle: saumyamohandas/garbage-classification-image-dataset
    kaggle_mount: /kaggle/input/datasets/saumyamohandas/garbage-classification-image-dataset
    historical_evaluated_test_images: 463
    separate_audit_filtered_final_test_images: 454
    audit_split_summary: REMNET/06_Dataset_Preparation/REMNET_split_summary.json
    classification_input_resolution: [32, 32]
    sustainability_input_resolution: [32, 32]
  v2_external:
    url: https://www.kaggle.com/datasets/sumn2u/garbage-classification-v2
    kaggle_handle_versioned: sumn2u/garbage-classification-v2/versions/12
    kaggle_mount: /kaggle/input/datasets/sumn2u/garbage-classification-v2
    screened_images: 4931
    audited_manifest: Garbage Classification V2 external validation/07_Garbage_Classification_V2/Dataset verification/Section2_Final_Automated_Screened_Six_Class_Manifest.csv
    collection_provenance_independent: not_established
    license_conflict_unresolved: true
  d3_realwaste:
    official_url: https://archive.ics.uci.edu/dataset/908/realwaste
    doi: https://doi.org/10.24432/C5SS4G
    kaggle_mirror_url: https://www.kaggle.com/datasets/akash264208/real-waste
    kaggle_mount: /kaggle/input/datasets/akash264208/real-waste
    class_root: /kaggle/input/datasets/akash264208/real-waste/realwaste-main/RealWaste
    screened_images: 3497
    audited_manifest: RealWaste external validation/08_RealWaste/Dataset verification/D3_Section2_Final_Automated_Screened_Six_Class_Manifest.csv
    miscellaneous_trash_maps_to: trash
    original_source_license: CC-BY-4.0

checkpoint_mounts:
  external_classification: /kaggle/input/datasets/akash264208/checkpoint-manifist
  external_d3_sustainability: /kaggle/input/datasets/akash264208/manifist-part2/Section3
  external_d3_sustainability_manifest: /kaggle/input/datasets/akash264208/manifist-part2/Section3/manifist
  checkpoints_in_repository: false

# Actual D3 classification and sustainability transforms by architecture:
# Each model matches across those two workflows, but models use different sizes.
d3_evaluation:
  batch_size: 32
  input_resolution_by_model:
    MobileNetV2: [384, 384]
    EfficientNet-Lite0: [384, 384]
    ResNet50: [350, 350]
    REMNET: [484, 484]
  rgb_normalization:
    mean: [0.5, 0.5, 0.5]
    std: [0.5, 0.5, 0.5]
  zero_shot: true
  fine_tune_on_target: false

sustainability:
  emissions_tracker: CodeCarbon
  native_co2e_and_standardized_co2e_are_distinct: true
  standardized_grid_intensity_kg_co2e_per_kwh: 0.475
  d3_inference_passes_per_seed: 2
  d3_unique_images_per_seed: 3497
  d3_processed_images_per_seed: 6994
  log_source: 09_Sustainability_Results/REMNET_Sustainability_Five_Seed_Source_Data(1).csv
  performance_energy_are_paired_measurements: false

benchmark:
  throughput_notebook: REMNET/05_Computational_Complexity/throughput.ipynb
  uses_checkpoint_weights: false
  input_resolution: [32, 32]
  batch_size_latency: 1
  batch_size_throughput: 32
  real_time_p95_threshold_ms: 33.3333
